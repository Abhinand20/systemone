game: tic_tac_toe
board_size: 3
image_size:
  - 512
  - 512
default_render_variant: clean_default
render_variants:
  - clean_default
  - labeled_margins
  - dark_low_contrast
  - thin_alt_font
  - tilt_blur
default_text_format: json_canonical
