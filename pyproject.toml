[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dm-bench"
version = "0.1.0"
description = "Multimodal agent benchmark comparing typed Decision Models against generative VLMs/LLMs on games."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typesafe-sdk[pil]>=0.7.5",
    "google-genai>=3.3.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "pillow>=10.3.0",
    "rich>=13.7.0",
    "numpy>=1.26.0",
    "matplotlib>=3.9.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
bench = "dm_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dm_bench*"]

[tool.setuptools.package-data]
dm_bench = ["viewer/static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
